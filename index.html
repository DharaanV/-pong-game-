<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🏓 Pong Game</h1>
        <div class="scoreboard">
            <div class="score">
                <h2>You</h2>
                <p id="playerScore">0</p>
            </div>
            <div class="score">
                <h2>Computer</h2>
                <p id="computerScore">0</p>
            </div>
        </div>
        <canvas id="pongCanvas" width="1000" height="600"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong> Move your paddle with <strong>Mouse</strong> or <strong>Arrow Keys (↑ ↓)</strong></p>
            <p><strong>Goal:</strong> Score points by getting the ball past the computer's paddle!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
